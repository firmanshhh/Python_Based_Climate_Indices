name: rain-indices
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - xarray>=2023.1
  - dask>=2023.1
  - netcdf4>=1.6          # dibutuhkan xarray untuk baca/tulis file .nc
